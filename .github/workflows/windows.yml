name: Windows

on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-rubberband
            mingw-w64-ucrt-x86_64-mesa
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pybind11
            git
      - name: Python starts
        run: python -u -X faulthandler -c "import sys; print(sys.version)"
      - name: Probe
        continue-on-error: true
        run: python -u -X faulthandler .github/windows-probe.py
      - name: Try building pyvirtualcam from source
        continue-on-error: true
        run: |
          git clone -q --recursive --depth 1 https://github.com/letmaik/pyvirtualcam
          pip install --break-system-packages --no-build-isolation ./pyvirtualcam 2>&1 | tail -25
          python -c "import pyvirtualcam; print('PASS pyvirtualcam', pyvirtualcam.__version__)"
