name: Windows

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
      - name: Install MSYS2 packages
        # mirror.msys2.org has stalled for whole runs; try a university mirror first, and retry.
        run: |
          for repo in mingw msys; do
            list=/etc/pacman.d/mirrorlist.$repo
            path='mingw/$repo'; [ $repo = msys ] && path='msys/$arch'
            { for host in https://mirrors.dotsrc.org/msys2; do echo "Server = $host/$path/"; done; cat $list; } > $list.new
            mv $list.new $list
          done
          for attempt in 1 2 3; do
            pacman -Sy --noconfirm --needed \
              mingw-w64-ucrt-x86_64-python \
              mingw-w64-ucrt-x86_64-python-gobject \
              mingw-w64-ucrt-x86_64-python-pip \
              mingw-w64-ucrt-x86_64-python-numpy \
              mingw-w64-ucrt-x86_64-gtk4 \
              mingw-w64-ucrt-x86_64-libadwaita \
              mingw-w64-ucrt-x86_64-gstreamer \
              mingw-w64-ucrt-x86_64-gst-plugins-base \
              mingw-w64-ucrt-x86_64-gst-plugins-good \
              mingw-w64-ucrt-x86_64-gst-plugins-bad \
              mingw-w64-ucrt-x86_64-rubberband \
              mingw-w64-ucrt-x86_64-mesa \
              mingw-w64-ucrt-x86_64-toolchain \
              mingw-w64-ucrt-x86_64-pybind11 \
              mingw-w64-ucrt-x86_64-ffmpeg \
              mingw-w64-ucrt-x86_64-librsvg \
              git && break
            echo "install attempt $attempt failed; retrying in 30s"; sleep 30
            [ $attempt = 3 ] && exit 1
          done
      - name: Build pyvirtualcam
        # Its setup.py passes an MSVC-only linker flag; MinGW needs -ladvapi32 instead.
        run: |
          git clone -q --recursive --depth 1 https://github.com/letmaik/pyvirtualcam
          grep -rl "DEFAULTLIB" pyvirtualcam --include=setup.py | xargs sed -i 's#/DEFAULTLIB:advapi32.lib#-ladvapi32#'
          pip install -q --break-system-packages --no-build-isolation ./pyvirtualcam
          python -c "import pyvirtualcam; print('pyvirtualcam', pyvirtualcam.__version__)"
      - name: Self-test
        timeout-minutes: 15  # a failed GStreamer test can leave the process hanging instead of exiting
        # The server has no GPU, so Mesa's software renderer stands in. Mesa's opengl32.dll sits next to
        # python.exe here; a packaged app must not ship it, or it would override users' graphics drivers.
        env:
          GALLIUM_DRIVER: llvmpipe
        run: python -u -X faulthandler redbarn-studio --self-test
      - name: Package
        run: |
          pip install -q --break-system-packages pyinstaller pyinstaller-hooks-contrib
          cp redbarn-studio redbarn_studio.py
          python - <<'EOF'
          import re
          import gi
          gi.require_version("GdkPixbuf", "2.0")
          from gi.repository import GdkPixbuf
          svg = re.search(r'ICON_SVG = """(.*?)"""', open("redbarn-studio", encoding="utf-8").read(), re.S).group(1)
          loader = GdkPixbuf.PixbufLoader()
          loader.write(svg.encode())
          loader.close()
          loader.get_pixbuf().scale_simple(256, 256, GdkPixbuf.InterpType.BILINEAR).savev("redbarn-studio.ico", "ico", [], [])
          EOF
          pyinstaller --noconfirm --log-level WARN .github/windows-package.spec
          cp LICENSE README.md "dist/Redbarn Studio/"
          du -sh "dist/Redbarn Studio"
          echo "Largest files in the package:"; find "dist/Redbarn Studio" -type f -printf "%s %P\n" | sort -rn | sed -n 1,15p  # sed, not head: head ends the pipe early
          # Software OpenGL is only for this GPU-less server: shipped, it would override users' graphics drivers.
          if find "dist/Redbarn Studio" -iname "opengl32.dll" -o -iname "libgallium_wgl.dll" -o -iname "libLLVM*.dll" | grep .; then echo "Mesa OpenGL is in the package"; exit 1; fi
      - name: Test the package
        timeout-minutes: 15
        # A copy gets Mesa, because the server has no GPU; the download itself never does.
        run: |
          cp -r "dist/Redbarn Studio" pkgtest
          cp /ucrt64/bin/opengl32.dll /ucrt64/bin/libgallium_wgl.dll /ucrt64/bin/libLLVM*.dll pkgtest/
          export GALLIUM_DRIVER=llvmpipe
          ./pkgtest/"Redbarn Studio.exe" --self-test | tee selftest.txt
          grep -q "self-test passed" selftest.txt || { echo "packaged self-test failed"; exit 1; }
          # The self-test skips pitch voices without Rubber Band; in the download that means a missing file.
          if grep -q "Rubber Band isn't installed" selftest.txt; then echo "Rubber Band is missing from the package"; exit 1; fi
          ./pkgtest/"Redbarn Studio.exe" &
          pid=$!
          sleep 20
          if kill -0 $pid 2>/dev/null; then echo "window still open after 20s"; kill $pid; else wait $pid; echo "app exited early with code $?"; exit 1; fi
      - name: Take OBS's virtual camera module
        # Only the camera module ships, not OBS Studio. OBS is GPL-2.0-or-later; its licence and source link go along.
        shell: pwsh
        env:
          OBS_VERSION: 33.0.1
          OBS_SHA256: 0d9436451c2d772b33428e3fdae9776f071895c335de17283176306fb72651d3
        run: |
          $zip = "obs.zip"
          Invoke-WebRequest "https://github.com/obsproject/obs-studio/releases/download/$env:OBS_VERSION/OBS-Studio-$env:OBS_VERSION-Windows-x64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:OBS_SHA256) { throw "OBS zip doesn't match its pinned SHA-256" }
          Expand-Archive $zip obs
          New-Item -ItemType Directory virtualcam | Out-Null
          Get-ChildItem obs -Recurse -Filter "obs-virtualcam-module*.dll" | ForEach-Object { Write-Output $_.FullName; Copy-Item $_.FullName virtualcam }
          if ((Get-ChildItem virtualcam).Count -lt 2) { throw "virtual camera modules not found in the OBS zip" }
          Invoke-WebRequest "https://raw.githubusercontent.com/obsproject/obs-studio/$env:OBS_VERSION/COPYING" -OutFile virtualcam/COPYING.txt
          Set-Content virtualcam/README.txt "OBS Virtual Camera module from OBS Studio $env:OBS_VERSION (https://obsproject.com).`r`nLicensed under the GNU GPL version 2 or later: see COPYING.txt.`r`nSource code: https://github.com/obsproject/obs-studio/tree/$env:OBS_VERSION"
      - name: Show the camera module's DLL imports
        # Anything here that isn't a Windows system DLL would have to ship too.
        run: for f in virtualcam/*.dll; do echo "$f:"; objdump -p "$f" | grep "DLL Name"; done
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Select-Object -Last 2
          $env:APP_VERSION = (Select-String -Path redbarn-studio -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q .github\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item installer\Redbarn-Studio-Setup.exe | Format-Table Name, Length
      - name: Install it, as a user would
        shell: pwsh
        timeout-minutes: 10
        run: |
          Set-Service audiosrv -StartupType Automatic
          Start-Service audiosrv
          # Windows privacy setting "Let desktop apps access your microphone"; often off on servers.
          foreach ($k in "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone",
                         "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone") {
            New-Item -Path $k -Force | Out-Null
            Set-ItemProperty -Path $k -Name Value -Value Allow
          }
          $p = Start-Process installer\Redbarn-Studio-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=vbcable', '/LOG=install.log' -PassThru
          if (-not $p.WaitForExit(480000)) { $p.Kill(); Get-Content install.log -Tail 30; throw "installer timed out" }
          Get-Content install.log | Select-String "VB-CABLE|regsvr32|Exit code|error" | Select-Object -Last 15
          if (-not (Test-Path "$env:ProgramFiles\Redbarn Studio\Redbarn Studio.exe")) { throw "app not installed" }
          $cam = (Get-ItemProperty "Registry::HKEY_CLASSES_ROOT\CLSID\{A3FCE0F5-3493-419F-958A-ABA1250EC20B}\InprocServer32" -ErrorAction SilentlyContinue).'(default)'
          Write-Output "virtual camera registered at: $cam"
          if (-not $cam) { throw "virtual camera isn't registered" }
          Get-PnpDevice -FriendlyName '*CABLE*' -ErrorAction SilentlyContinue | Format-Table -AutoSize FriendlyName, Status
      - name: End-to-end, through the installed camera and VB-CABLE
        env:
          GALLIUM_DRIVER: llvmpipe
        run: python -u -X faulthandler .github/windows-e2e.py
      - name: Check the installed app
        # bash, as in "Test the package": it captures a windowed program's output, which PowerShell doesn't.
        run: |
          "/c/Program Files/Redbarn Studio/Redbarn Studio.exe" --check | tee check.txt
          grep -q "OBS Virtual Camera" check.txt || { echo "no --check output"; exit 1; }
          if grep -E "✗ (OBS Virtual Camera|VB-CABLE)" check.txt; then echo "installed app can't find the virtual camera or mic"; exit 1; fi
          # One copy at a time: a second launch (say Start at Login, then a click) must hand over to the first and exit.
          export GSK_RENDERER=cairo  # the installed app has no software OpenGL, and the server has no GPU
          app="/c/Program Files/Redbarn Studio/Redbarn Studio.exe"
          "$app" & first=$!
          sleep 20
          "$app" & second=$!
          sleep 10
          if kill -0 $second 2>/dev/null; then echo "a second copy kept running"; kill $first $second; exit 1; fi
          if ! kill -0 $first 2>/dev/null; then echo "the first copy exited"; exit 1; fi
          kill $first
          echo "second launch handed over to the running copy"
      - name: Update over the previous release, as the in-app updater does
        # Settings must survive, and the updater's /RELAUNCH=1 must reopen the app after installing.
        shell: pwsh
        timeout-minutes: 10
        run: |
          $p = Start-Process "$env:ProgramFiles\Redbarn Studio\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          $p.WaitForExit(120000) | Out-Null
          Start-Sleep 5
          Invoke-WebRequest "https://github.com/GoochGrenade/redbarn-studio/releases/download/v1.3.1/Redbarn-Studio-Setup.exe" -OutFile old-setup.exe
          $p = Start-Process old-setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          if (-not $p.WaitForExit(300000)) { throw "1.3.1 installer timed out" }
          $settings = "$env:LOCALAPPDATA\redbarn-studio\settings.json"
          New-Item -ItemType Directory -Force (Split-Path $settings) | Out-Null
          Set-Content $settings '{"look": "Noir", "voice": "Robot", "send_level": 0.4, "dark": false}'
          $before = (Get-FileHash $settings).Hash
          $p = Start-Process installer\Redbarn-Studio-Setup.exe -ArgumentList '/SILENT', '/NORESTART', '/CLOSEAPPLICATIONS', '/RELAUNCH=1', '/LOG=update.log' -PassThru
          if (-not $p.WaitForExit(300000)) { throw "update installer timed out" }
          Start-Sleep 10
          if ((Get-FileHash $settings).Hash -ne $before) { throw "the update changed the user's settings" }
          $running = Get-Process "Redbarn Studio" -ErrorAction SilentlyContinue
          if (-not $running) { Get-Content update.log -Tail 20; throw "the app didn't reopen after the update" }
          $running | Stop-Process -Force
          $version = (Select-String -Path redbarn-studio -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          $installed = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{E47D0CD0-B482-458D-904E-8E06AE09CE4A}_is1").DisplayVersion
          if ($installed -ne $version) { throw "installed version is $installed, expected $version" }
          Write-Output "updated 1.3.1 to ${installed}: settings kept, app reopened"
      - name: Uninstall, as a user would
        shell: pwsh
        run: |
          $p = Start-Process "$env:ProgramFiles\Redbarn Studio\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          $p.WaitForExit(120000) | Out-Null
          Start-Sleep 5  # the uninstaller finishes removing itself from a copy in the temp folder
          if (Test-Path "$env:ProgramFiles\Redbarn Studio\Redbarn Studio.exe") { throw "app still installed" }
          if (Test-Path "Registry::HKEY_CLASSES_ROOT\CLSID\{A3FCE0F5-3493-419F-958A-ABA1250EC20B}\InprocServer32") { throw "virtual camera still registered" }
          Write-Output "uninstalled cleanly"
      - uses: actions/upload-artifact@v4
        with:
          name: Redbarn-Studio-Setup
          path: installer/Redbarn-Studio-Setup.exe
