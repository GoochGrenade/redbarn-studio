name: Windows

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-rubberband
            mingw-w64-ucrt-x86_64-mesa
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pybind11
            git
      - name: Build pyvirtualcam
        # Its setup.py passes an MSVC-only linker flag; MinGW needs -ladvapi32 instead.
        run: |
          git clone -q --recursive --depth 1 https://github.com/letmaik/pyvirtualcam
          grep -rl "DEFAULTLIB" pyvirtualcam --include=setup.py | xargs sed -i 's#/DEFAULTLIB:advapi32.lib#-ladvapi32#'
          pip install -q --break-system-packages --no-build-isolation ./pyvirtualcam
          python -c "import pyvirtualcam; print('pyvirtualcam', pyvirtualcam.__version__)"
      - name: Self-test, server's default OpenGL
        continue-on-error: true
        run: python -u -X faulthandler redbarn-studio --self-test
      - name: Self-test, Mesa software OpenGL
        # The build server has no GPU; real PCs use their graphics driver.
        run: |
          cp "$(pacman -Ql mingw-w64-ucrt-x86_64-mesa | awk '/bin\/opengl32\.dll$/ {print $2}')" "$(dirname "$(which python)")/"
          GALLIUM_DRIVER=llvmpipe python -u -X faulthandler redbarn-studio --self-test
